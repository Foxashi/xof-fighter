[package]
name = "xof-fighter"
version = "0.1.0"
edition = "2024"
description = "cli tool for checking player counts"
license = "MIT"
repository = "https://github.com/Foxashi/xof-fighter"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
tabled = "0.15"
terminal_size = "0.3"
tokio = { version = "1.52.3", features = ["full"] }
